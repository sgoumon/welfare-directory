# =====================================================================
#  Animal Welfare Research Directory: search configuration
#  Edit this file to change which papers count as "animal welfare".
#  After editing, the next run notices changed rules and rebuilds from scratch.
#  (Raising from_year needs no rebuild: older papers are simply left out.)
# =====================================================================

# Only papers from this year onward are used (keeps the directory current
# and reduces outdated affiliations). Set to null to use all years.
from_year: 2020

# Only these publication types are used.
work_types: [article, review, book-chapter, preprint]

# ---------------------------------------------------------------------
# RULE A: core journals whose papers are ALL included, regardless of content.
# Switched off (empty): papers are selected only by their title/abstract
# (rules B-D), in any journal. To switch on, list OpenAlex source IDs, e.g.
#   S144449874: Animal Welfare (UFAW)
#   S78331093: Journal of Applied Animal Welfare Science
#   S179500637: Applied Animal Behaviour Science
# ---------------------------------------------------------------------
core_journals: {}

# ---------------------------------------------------------------------
# RULE B: strong welfare phrases, searched in title + abstract.
# OpenAlex stems words, so "welfare indicator" also finds "indicators".
# A paper matched here must ALSO mention an animal (see animal_terms
# and species below) unless the phrase itself contains "animal".
# Keep each group to about 8 phrases (long queries can fail).
# ---------------------------------------------------------------------
strong_phrases:
  - ["animal welfare", "farm animal welfare", "welfare assessment", "welfare indicator", "welfare quality", "welfare protocol", "animal-based measures", "positive welfare"]
  - ["five domains", "five freedoms", "affective state", "emotional state", "qualitative behaviour assessment", "qualitative behavior assessment", "judgement bias", "judgment bias"]
  - ["stereotypic behaviour", "stereotypic behavior", "stereotypies", "abnormal behaviour", "abnormal behavior", "grimace scale", "human-animal relationship", "stockmanship"]
  - ["humane slaughter", "humane endpoint", "humane endpoints", "welfare at slaughter", "welfare during transport", "on-farm euthanasia", "laboratory animal welfare", "3Rs"]

# ---------------------------------------------------------------------
# RULE C: the word "welfare" together with an animal word.
# Each list below is searched as:  welfare AND (term OR term OR ...)
# Papers are then dropped if they contain an exclusion phrase
# (economic / social welfare) and none of the strong phrases.
# ---------------------------------------------------------------------
welfare_with_animal:
  # farmed animals
  - ["pig", "pigs", "swine", "sow", "sows", "piglet", "piglets", "boar"]
  - ["cattle", "cow", "cows", "calf", "calves", "dairy", "beef", "bull"]
  - ["buffalo", "buffaloes", "yak", "yaks", "camel", "camels", "alpaca", "llama"]
  - ["poultry", "broiler", "broilers", "laying hen", "laying hens", "chicken", "chickens", "turkeys"]
  - ["duck", "ducks", "goose", "geese", "quail", "ostrich", "pheasant", "gamebirds"]
  - ["sheep", "ewe", "ewes", "lamb", "lambs", "goat", "goats", "reindeer"]
  - ["fish", "salmon", "trout", "tilapia", "carp", "catfish", "seabream", "aquaculture"]
  - ["shrimp", "prawn", "prawns", "crab", "lobster", "crustacean", "cephalopod", "decapod"]
  - ["insect", "insects", "black soldier fly", "mealworm", "cricket", "crickets", "honey bee", "bees"]
  - ["mink", "fur animal", "fur farming", "fox", "foxes", "raccoon dog", "deer", "farmed animal"]
  # companion animals
  - ["dog", "dogs", "canine", "puppy", "puppies", "cat", "cats", "feline"]
  - ["horse", "horses", "equine", "pony", "ponies", "donkey", "donkeys", "mule"]
  - ["rabbit", "rabbits", "guinea pig", "guinea pigs", "hamster", "ferret", "ferrets", "chinchilla"]
  - ["parrot", "parrots", "pet bird", "pet birds", "budgerigar", "reptile", "reptiles", "ornamental fish"]
  - ["pet", "pets", "companion animal", "companion animals", "shelter", "kennel", "cattery", "rehoming"]
  # laboratory, zoo and wild animals
  - ["mice", "mouse", "rat", "rats", "rodent", "rodents", "zebrafish", "laboratory animal"]
  - ["zoo", "zoos", "aquarium", "captive", "captivity", "sanctuary", "wildlife", "wild animals"]
  - ["primate", "primates", "great apes", "elephant", "elephants", "rhinoceros", "rhino", "rhinos"]
  - ["cetacean", "cetaceans", "dolphin", "dolphins", "whale", "marine mammal", "giraffe", "big cats"]
  # broad class words (catch species not named above)
  - ["animal", "animals", "livestock", "mammal", "mammals", "bird", "birds", "amphibian"]
  - ["amphibians", "vertebrate", "vertebrates", "invertebrate", "invertebrates", "ungulate", "ungulates", "farm animal"]

exclusion_phrases:
  - social welfare
  - welfare state
  - child welfare
  - welfare economics
  - economic welfare
  - consumer welfare
  - household welfare
  - welfare gains
  - welfare loss
  - welfare effects
  - welfare analysis
  - welfare recipients
  - human welfare
  - public welfare
  - homeless
  - homelessness

# ---------------------------------------------------------------------
# RULE D: welfare indicators and procedures that papers often study without
# using the word "welfare". A term must appear in title + abstract AND the
# paper must be classified by OpenAlex under one of the welfare_topics below
# (these terms are too generic on their own, e.g. most cortisol papers are
# not welfare papers). The same lists also give every included paper its
# research-field tags (Behavioural, Physiological, ...), shown and filterable
# on the search page. Terms are sent to OpenAlex in groups of 8 automatically.
# ---------------------------------------------------------------------
indicators:
  Behavioural: ["abnormal behaviour", "abnormal behavior", "aggression", "agonistic behaviour", "agonistic behavior", "affiliative behaviour", "affiliative behavior", "play behaviour", "play behavior", "vocalisation", "vocalization", "vocalisations", "vocalizations", "time budget", "activity budget", "lying behaviour", "lying behavior", "rumination", "feeding behaviour", "feeding behavior", "avoidance distance", "fearfulness", "social behaviour", "social behavior", "maternal behaviour", "maternal behavior", "behavioural needs", "behavioral needs", "tail biting", "feather pecking", "environmental enrichment", "enrichment", "stereotypic behaviour", "stereotypic behavior", "stereotypies"]
  Physiological: ["cortisol", "corticosterone", "glucocorticoid", "glucocorticoids", "heart rate variability", "HPA axis", "oxytocin", "stress response", "infrared thermography", "acute phase protein", "acute phase proteins", "stress hormones", "physiological stress", "immune function"]
  Health: ["lameness", "injury", "injuries", "lesions", "mortality", "body condition", "mastitis", "footpad dermatitis", "keel bone", "tail lesions", "skin lesions", "hock burns", "claw lesions", "pain", "pain assessment", "analgesia", "grimace scale"]
  Cognitive & affective: ["cognitive bias", "judgement bias", "judgment bias", "anticipatory behaviour", "anticipatory behavior", "emotional valence", "positive affect", "negative affect", "preference test", "motivation", "consumer demand", "conditioned place preference", "learned helplessness", "emotional contagion", "affective state", "emotions", "qualitative behaviour assessment", "qualitative behavior assessment"]
  Procedures & management: ["stunning", "slaughter", "castration", "dehorning", "disbudding", "beak trimming", "tail docking", "mutilation", "transport stress", "heat stress", "space allowance", "stocking density", "handling", "novel object", "fear test", "housing system"]

# An indicator tag (research field) is shown only if it covers at least this
# share of an institution's or researcher's papers (0.05 = 5%).
indicator_min_share: 0.05

welfare_topics:
  T10838: Animal Behavior and Welfare Studies
  T14206: Animal Law and Welfare
  T12281: Animal testing and alternatives

# ---------------------------------------------------------------------
# Words that count as "mentions an animal" for rule B.
# The species terms below also count.
# ---------------------------------------------------------------------
animal_terms: [animal, animals, livestock, farm, farmed, zoo, wildlife, laboratory, veterinary, pet, pets, companion]

# ---------------------------------------------------------------------
# Species tags shown as filters on the search page.
# A paper gets a tag if any term appears in its title, abstract or keywords.
# Whole-word matching, case-insensitive.
# ---------------------------------------------------------------------
species:
  Pigs: [pig, pigs, swine, sow, sows, piglet, piglets, boar, boars, porcine]
  Cattle & buffalo: [cattle, cow, cows, calf, calves, heifer, heifers, bull, bulls, dairy, bovine, beef, steer, steers, buffalo, buffaloes, yak, yaks]
  Poultry & farmed birds: [poultry, broiler, broilers, hen, hens, chicken, chickens, chick, chicks, turkeys, duck, ducks, quail, laying hen, laying hens, goose, geese, ostrich, ostriches, pheasant, pheasants, gamebirds]
  Sheep & goats: [sheep, ewe, ewes, lamb, lambs, ram, rams, ovine, goat, goats, kid goats, caprine]
  Camelids: [camel, camels, dromedary, alpaca, alpacas, llama, llamas]
  Horses & donkeys: [horse, horses, equine, pony, ponies, donkey, donkeys, mule, mules, foal, foals]
  Dogs: [dog, dogs, canine, puppy, puppies]
  Cats: [cat, cats, feline, kitten, kittens]
  Rabbits: [rabbit, rabbits]
  Small pets: [guinea pig, guinea pigs, hamster, hamsters, ferret, ferrets, chinchilla, chinchillas, gerbil, gerbils]
  Pet birds: [parrot, parrots, pet bird, pet birds, budgerigar, budgerigars, canary, canaries, psittacine]
  Reptiles & amphibians: [reptile, reptiles, snake, snakes, lizard, lizards, tortoise, tortoises, turtle, turtles, amphibian, amphibians, frog, frogs]
  Laboratory rodents: [mouse, mice, rat, rats, rodent, rodents]
  Fish: [fish, fishes, salmon, trout, zebrafish, tilapia, carp, catfish, cod, seabream, sea bass, aquaculture, ornamental fish]
  Crustaceans & cephalopods: [crustacean, crustaceans, crayfish, cuttlefish, decapod, decapods, crab, crabs, lobster, lobsters, shrimp, prawn, prawns, octopus, cephalopod, cephalopods]
  Insects: [insect, insects, black soldier fly, mealworm, mealworms, cricket, crickets, bee, bees, honey bee]
  Fur animals: [mink, fur animal, fur animals, fur farming, fox, foxes, raccoon dog, raccoon dogs]
  Primates: [primate, primates, macaque, macaques, monkey, monkeys, chimpanzee, chimpanzees, marmoset, marmosets, great apes, gorilla, gorillas, orangutan, orangutans]
  Deer: [deer, red deer, fallow deer, roe deer, reindeer]
  Marine mammals: [cetacean, cetaceans, dolphin, dolphins, whale, whales, marine mammal, marine mammals, pinniped, pinnipeds, sea lion, sea lions]
  Zoo & wild animals: [zoo, zoos, wildlife, wild animals, aquarium, sanctuary, captive wild, elephant, elephants, rhinoceros, rhino, rhinos, giraffe, giraffes, big cats, tiger, tigers, lion, lions]

# Which researchers are listed (institutions always count all papers):
#   researcher_min_papers: at least this many matching papers since from_year
#   researcher_min_focus:  matching papers must be at least this share of ALL
#                          their publications since from_year (0.25 = 25%).
#                          Set to 0 to switch off. OpenAlex totals include every
#                          output type (datasets, corrections...), so the true
#                          share is usually a little higher than calculated.
# Changing these does not need a new fetch: the directory is re-assembled.
#   researcher_focus_exempt_papers: researchers with at least this many matching
#                          papers are always listed, whatever their share. This
#                          protects people whose OpenAlex profile is mixed up
#                          with someone else's (which inflates their total).
researcher_min_papers: 2
researcher_min_focus: 0.25
researcher_focus_exempt_papers: 5

# Species of a paper: true = the species named in its title (falling back to
# the abstract only when the title names none). Avoids tagging papers with
# species they only mention for comparison, e.g. rodent studies cited in a pig review.
species_from_title_first: true

# Hide institutions where none of the authors passes the researcher filters
# below (their papers came only from occasional co-authors).
hide_empty_institutions: true

# Phrases that must NOT trigger a species tag.
species_not:
  Pigs: [guinea pig, guinea pigs]
  Cattle & buffalo: [sea cow, sea cows]
  Fish: [shellfish, starfish, jellyfish, crayfish, cuttlefish]

# A species tag is shown (and used by the filter) only if it covers at least
# this share of an institution's or researcher's papers (0.05 = 5%).
species_min_share: 0.05

# ---------------------------------------------------------------------
# Institution handling
#   when_parent_present: drop a department/centre if its parent university
#                        is also listed on the same paper (recommended)
#   always:              always roll up to the top-level organisation
#                        (careful: all Max Planck Institutes would become
#                        "Max Planck Society")
#   never:               keep exactly what OpenAlex lists
# ---------------------------------------------------------------------
subunit_rollup: when_parent_present

# Safety: stop if a query returns more works than this (it usually means
# the query was not understood and OpenAlex ignored the filter).
max_results_per_query: 150000
