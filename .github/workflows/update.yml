name: Update directory

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC; the script does nothing if the data is less than 28 days old
  workflow_dispatch:         # lets you start it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-directory
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Fetch from OpenAlex and build directory
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/build_directory.py

      - name: Save progress and results
        run: |
          git config user.name "directory-bot"
          git config user.email "directory-bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update animal welfare directory data"
            git push
          fi
